[project]
name = "signal-engine-agents"
version = "0.1.0"
description = "Signal Engine — stateless Python AI/NLP capability service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<0.200",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<0.60",
    # HTTP client for the Ollama provider adapter — no Ollama SDK
    # (docs/03-technical-spec.md Section 23; docs/adr/0006-ai-java-python-foundation.md).
    "httpx>=0.27,<1",
]

# Task 6A (docs/11-roadmap.md Section 6): the reusable Java<->Python AI capability
# contract, the LLM provider abstraction + Ollama adapter, versioned prompt
# assets, structured output with one bounded repair, and one trivial capability
# (echo) that proves the contract. No Signal Engine AI capability yet.

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Prompt assets ship alongside the package so a capability can load them from an
# installed wheel as well as from a source checkout (app/../prompts in both).
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "benchmarks"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
